name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Why: codecov-action v5 uses OIDC for tokenless uploads on public repos.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        # Bash on every runner — the same step scripts on Windows.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # Strict: a failed install fails the job, so no later step can skip for lack of a tool.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: API contract
        id: contract
        uses: poli-page/api-contract@0eba96c1ecf9a28b7e259f444f3ca5b7c059d5fd # v1.3.0

      - name: Test
        # tests/test_contract.py runs the contract's SDK cases. With CI set it fails, never
        # skips, when POLI_CONTRACT is missing; CI is set here too rather than left to the runner.
        env:
          CI: "true"
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: |
          test -s "$POLI_CONTRACT" || { echo "::error::API contract file missing: '$POLI_CONTRACT'"; exit 1; }
          python -m pytest -v -rs --cov=poli_page --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        # Why: only upload from one matrix slot to avoid duplicate reports.
        # use_oidc is required: Codecov rejects tokenless uploads on the default
        # (protected) branch, and we've granted id-token: write at the job level.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
          use_oidc: true

  # One check that sums up the PR jobs: the name the `main` ruleset requires for merges
  ci:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
